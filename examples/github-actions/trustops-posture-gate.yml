# Example: block merges when Koda posture regresses.
# Copy into .github/workflows/ and set repository secrets:
#   TRUSTOPS_URL, TRUSTOPS_API_TOKEN
name: Koda posture gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Koda posture
        uses: ./.github/actions/posture-gate
        with:
          trustops-url: ${{ secrets.TRUSTOPS_URL }}
          api-token: ${{ secrets.TRUSTOPS_API_TOKEN }}
          correlation-id: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          min-score: "70"
          max-critical-violations: "0"
          max-open-violations: "25"
          max-failing-control-tests: "0"
