name: Koda Posture Gate
description: >-
  Query Koda /api/v1/posture/current and /api/v1/control-tests, then fail the job
  when score, violation, or control-regression thresholds are not met. Use in
  pull_request or deployment workflows to block merges when posture regresses.
branding:
  icon: shield
  color: blue
inputs:
  trustops-url:
    description: Base URL of the Koda deployment (for example https://koda.example.com)
    required: true
  api-token:
    description: Koda API bearer token with read scope (omit for local --allow-insecure-no-auth)
    required: false
    default: ""
  correlation-id:
    description: X-Correlation-ID for audit trail (defaults to GITHUB_RUN_ID when unset in CI)
    required: false
    default: ""
  min-score:
    description: Minimum posture score (0-100) required to pass
    required: false
    default: "0"
  max-critical-violations:
    description: Maximum allowed open critical violations
    required: false
    default: "0"
  max-open-violations:
    description: Maximum allowed open violations (-1 skips this check)
    required: false
    default: "-1"
  max-failing-control-tests:
    description: Maximum allowed failing control tests (-1 skips this check)
    required: false
    default: "0"
  allowed-failing-controls:
    description: Comma-separated control_ids that may fail without failing the gate
    required: false
    default: ""
  framework:
    description: Optional framework filter when listing failing control tests
    required: false
    default: ""
  fail-on-stale-evidence:
    description: When true, fail if any controls have stale or expired evidence
    required: false
    default: "false"
outputs:
  posture_score:
    description: Posture score returned by Koda
    value: ${{ steps.gate.outputs.posture_score }}
  posture_state:
    description: Posture state label (healthy, at_risk, etc.)
    value: ${{ steps.gate.outputs.posture_state }}
  open_violation_count:
    description: Open violation count at evaluation time
    value: ${{ steps.gate.outputs.open_violation_count }}
  critical_violation_count:
    description: Open critical violation count at evaluation time
    value: ${{ steps.gate.outputs.critical_violation_count }}
  failed_control_test_count:
    description: Failing control test count after allowlist filtering
    value: ${{ steps.gate.outputs.failed_control_test_count }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      run: bash "${{ github.action_path }}/posture-gate.sh"
      env:
        TRUSTOPS_URL: ${{ inputs.trustops-url }}
        TRUSTOPS_API_TOKEN: ${{ inputs.api-token }}
        CORRELATION_ID: ${{ inputs.correlation-id != '' && inputs.correlation-id || github.run_id }}
        MIN_SCORE: ${{ inputs.min-score }}
        MAX_CRITICAL_VIOLATIONS: ${{ inputs.max-critical-violations }}
        MAX_OPEN_VIOLATIONS: ${{ inputs.max-open-violations }}
        MAX_FAILING_CONTROL_TESTS: ${{ inputs.max-failing-control-tests }}
        ALLOWED_FAILING_CONTROLS: ${{ inputs.allowed-failing-controls }}
        FRAMEWORK: ${{ inputs.framework }}
        FAIL_ON_STALE_EVIDENCE: ${{ inputs.fail-on-stale-evidence }}
