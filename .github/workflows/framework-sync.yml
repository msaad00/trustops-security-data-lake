name: framework-sync

on:
  schedule:
    # 06:13 UTC every Monday — staggered to dodge regulator burst load
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Sync framework sources
        run: security-lakehouse frameworks sync --allow-network | tee sync.json
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frameworks/registry.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose PR body
        if: steps.drift.outputs.drift == 'true'
        run: |
          {
            echo "Automated framework sync detected drift in \`frameworks/registry.json\`."
            echo "Reviewer should verify each updated \`source_sha256\` against the"
            echo "regulator's site before merging."
            echo
            echo '```'
            cat sync.json
            echo '```'
          } > pr-body.md
      - name: Open PR with drift
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(frameworks): sync official sources"
          title: "chore(frameworks): sync official sources"
          # body-path, not an inline body: a `$(cat sync.json)` in the YAML input
          # is passed as a literal string, so the sync diff never rendered.
          body-path: pr-body.md
          branch: chore/framework-sync
          delete-branch: true
