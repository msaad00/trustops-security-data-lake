name: release

# Publishes on a version tag. Nothing here runs on a branch push, so a merge to
# main cannot ship a release by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# Never let two tag pushes publish the same or overlapping releases at once.
# cancel-in-progress is false: a publish already underway must finish, not be
# killed halfway between PyPI and the GitHub release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the version. If pyproject disagrees, the artifact would carry a
  # version nobody asked for, so stop before anything is built.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          project_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "version=${project_version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag build; using pyproject version ${project_version}"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${project_version}"
            exit 1
          fi
          # The Helm chart pins image.tag to appVersion; if it lags the release
          # tag, `helm install` pulls a non-existent image. Gate it here so the
          # chart can never ship a patch behind the published image again.
          chart_app_version="$(grep -m1 '^appVersion:' deploy/helm/trustops/Chart.yaml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "${chart_app_version}" != "${project_version}" ]; then
            echo "::error::Chart.yaml appVersion ${chart_app_version} does not match release version ${project_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches pyproject + chart ${project_version}"

  build:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The console is gitignored and declared as package data. Building it
      # before packaging is what keeps the published wheel from being silently
      # consoleless.
      - name: Build console
        run: make web-install web-build

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel is publishable
        run: python tools/verify_wheel.py dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    # Publish only from a version tag. A workflow_dispatch with dry_run:false on
    # a branch would otherwise reach PyPI with no tag↔version gate having run.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing; no long-lived token to leak
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustops
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [pypi, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
