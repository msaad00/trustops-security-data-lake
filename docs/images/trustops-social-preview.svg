<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps — evidence to proof</title>
  <desc id="desc">Open-source trust operations for customer-owned evidence, deterministic controls, and audit-ready proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050b14"/>
      <stop offset="0.56" stop-color="#0a1425"/>
      <stop offset="1" stop-color="#07333a"/>
    </linearGradient>
    <linearGradient id="mark" x1="78" y1="62" x2="166" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#718eff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="0" x2="1118" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6687ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="180" fill="#18bdb3" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1070" cy="70" r="240" fill="none" stroke="#4f7cff" stroke-width="2" opacity="0.13"/>
  <path d="M0 528C243 447 412 630 671 524s351-17 529-92v198H0Z" fill="#14b8a6" opacity="0.07"/>
  <g class="font">
    <g transform="translate(74 58)">
      <path d="M54 0 104 18v37c0 30-19.8 53-50 65C23.8 108 4 85 4 55V18L54 0Z" fill="url(#mark)"/>
      <path d="M30 35h48v12H60v39H48V47H30V35Z" fill="#fff"/>
      <path d="m68 83 8 8 18-20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="208" y="133" font-size="68" font-weight="850" letter-spacing="-3" fill="#f8fafc">TrustOps</text>
    <text x="82" y="234" font-size="15" font-weight="800" letter-spacing="3" fill="#76d8e3">OPEN-SOURCE TRUST OPERATIONS</text>
    <text x="78" y="296" font-size="43" font-weight="820" letter-spacing="-1.4" fill="#f8fafc">Turn cloud evidence into</text>
    <text x="78" y="349" font-size="43" font-weight="820" letter-spacing="-1.4" fill="url(#accent)">audit-ready proof.</text>
    <text x="80" y="397" font-size="19" font-weight="560" fill="#a8b5c7">Read-only evidence · deterministic controls · immutable snapshots</text>
    <g transform="translate(78 468)">
      <rect width="240" height="72" rx="15" fill="#101d32" stroke="#2e4361"/>
      <text x="22" y="29" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7890b2">01 · COLLECT</text>
      <text x="22" y="53" font-size="17" font-weight="800" fill="#eef5ff">Customer-owned</text>
      <path d="M248 36h32" stroke="#6687ff" stroke-width="3" stroke-linecap="round"/>
      <rect x="288" width="240" height="72" rx="15" fill="#101d32" stroke="#36517a"/>
      <text x="310" y="29" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7890b2">02 · EVALUATE</text>
      <text x="310" y="53" font-size="17" font-weight="800" fill="#eef5ff">Deterministic</text>
      <path d="M536 36h32" stroke="#4d9ee4" stroke-width="3" stroke-linecap="round"/>
      <rect x="576" width="240" height="72" rx="15" fill="#101d32" stroke="#34728b"/>
      <text x="598" y="29" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7890b2">03 · OPERATE</text>
      <text x="598" y="53" font-size="17" font-weight="800" fill="#eef5ff">Actionable</text>
      <path d="M824 36h32" stroke="#38bfc6" stroke-width="3" stroke-linecap="round"/>
      <rect x="864" width="240" height="72" rx="15" fill="#ecfeff" stroke="#5eead4"/>
      <text x="886" y="29" font-size="11" font-weight="800" letter-spacing="1.6" fill="#0f766e">04 · PROVE</text>
      <text x="886" y="53" font-size="17" font-weight="850" fill="#0f2830">Verifiable</text>
