<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps Snowflake security data lake architecture</title>
  <desc id="desc">A lane-based architecture diagram showing Snowflake streaming ingestion, governed Iceberg tables, dynamic tables, TrustOps continuous evaluation, and closed-loop remediation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#0b3b54"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cab"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#713f12"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#17304b" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowCyan" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#34d399"/>
    </marker>
    <marker id="arrowGold" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#fbbf24"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 900; letter-spacing: -0.02em; }
      .subtitle { fill: #cbd5e1; font-size: 14px; font-weight: 650; }
      .lane { fill: #67e8f9; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .lanePurple { fill: #c4b5fd; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .cardTitle { fill: #ffffff; font-size: 18px; font-weight: 900; }
      .cardText { fill: #dbeafe; font-size: 12px; font-weight: 650; }
      .muted { fill: #94a3b8; font-size: 11px; font-weight: 700; }
      .tiny { fill: #94a3b8; font-size: 10px; font-weight: 700; }
      .code { fill: #e0f2fe; font-size: 12px; font-weight: 850; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.4; }
      .signal { fill: #101b2d; stroke: #334155; stroke-width: 1.25; }
      .blueBox { fill: rgba(14, 116, 144, 0.30); stroke: #38bdf8; stroke-width: 1.4; }
      .snowBox { fill: rgba(14, 165, 233, 0.18); stroke: #38bdf8; stroke-width: 1.55; }
      .greenBox { fill: rgba(6, 78, 59, 0.82); stroke: #34d399; stroke-width: 1.35; }
      .goldBox { fill: rgba(120, 53, 15, 0.66); stroke: #fbbf24; stroke-width: 1.3; }
      .purpleBox { fill: rgba(49, 46, 129, 0.72); stroke: #a78bfa; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="url(#bg)"/>
  <rect width="1500" height="900" fill="url(#grid)" opacity="0.92"/>
  <circle cx="1225" cy="190" r="210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.16"/>
  <circle cx="1238" cy="660" r="168" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.18"/>

  <g class="sans">
    <text x="64" y="66" class="title">Snowflake Security Data Lake for TrustOps</text>
    <text x="64" y="96" class="subtitle">Enterprise-governed evidence, streaming ingest, Iceberg interoperability, and continuous trust evaluation in the customer's boundary.</text>

    <g transform="translate(1144 36)" filter="url(#shadow)">
      <rect width="292" height="76" rx="17" class="box"/>
      <g transform="translate(24 18)" stroke="#38bdf8" stroke-width="3" fill="none">
        <path d="M18 0v34M0 17h36M6 6l24 22M30 6 6 28"/>
      </g>
      <text x="78" y="31" class="cardTitle" font-size="16">Snowflake pack</text>
      <text x="78" y="52" class="tiny">streaming · rollups · policies · Iceberg</text>
    </g>

    <g transform="translate(64 148)">
      <rect width="160" height="30" rx="15" fill="#0e7490" stroke="#22d3ee"/>
      <text x="80" y="20" text-anchor="middle" class="lane">SIGNAL LANE</text>
    </g>

    <g transform="translate(64 208)" filter="url(#shadow)">
      <rect width="304" height="284" rx="22" class="box"/>
      <text x="26" y="44" class="cardTitle">Covered sources</text>
      <text x="26" y="66" class="cardText">Security evidence already lands here.</text>
      <g transform="translate(26 96)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <circle cx="25" cy="26" r="15" fill="#f59e0b"/>
        <text x="50" y="24" class="code">AWS</text>
        <text x="50" y="40" class="tiny">CloudTrail · IAM</text>
      </g>
      <g transform="translate(164 96)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <circle cx="25" cy="26" r="15" fill="#3b82f6"/>
        <text x="50" y="24" class="code">GCP</text>
        <text x="50" y="40" class="tiny">audit · SCC</text>
      </g>
      <g transform="translate(26 164)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <circle cx="25" cy="26" r="15" fill="#2563eb"/>
        <text x="50" y="24" class="code">Azure</text>
        <text x="50" y="40" class="tiny">activity · NSG</text>
      </g>
      <g transform="translate(164 164)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <circle cx="25" cy="26" r="15" fill="#111827"/>
        <text x="50" y="24" class="code">Identity</text>
        <text x="50" y="40" class="tiny">Okta · Google</text>
      </g>
      <g transform="translate(26 232)">
        <rect width="112" height="38" rx="10" class="signal"/>
        <text x="18" y="23" class="code">Runtime AI</text>
      </g>
      <g transform="translate(164 232)">
        <rect width="112" height="38" rx="10" class="signal"/>
        <text x="18" y="23" class="code">Repos</text>
      </g>
    </g>

    <g transform="translate(430 202)" filter="url(#shadow)">
      <rect width="248" height="292" rx="20" fill="url(#teal)" stroke="#22d3ee" stroke-width="1.8"/>
      <text x="28" y="46" class="cardTitle">Ingest</text>
      <text x="28" y="68" class="cardText">Low-latency rows or batch files.</text>
      <rect x="28" y="98" width="192" height="40" rx="10" class="blueBox"/>
      <text x="124" y="123" text-anchor="middle" class="code">Snowpipe Streaming</text>
      <rect x="28" y="152" width="192" height="40" rx="10" class="blueBox"/>
      <text x="124" y="177" text-anchor="middle" class="code">Snowpipe / Kafka</text>
      <rect x="28" y="206" width="192" height="40" rx="10" class="blueBox"/>
      <text x="124" y="231" text-anchor="middle" class="code">OCSF JSON rows</text>
      <text x="28" y="270" class="tiny">stable IDs: event_uid, finding_uid</text>
    </g>

    <g transform="translate(756 164)" filter="url(#shadow)">
      <rect width="442" height="362" rx="24" fill="url(#snow)" stroke="#7dd3fc" stroke-width="2.2"/>
      <text x="34" y="50" class="cardTitle" font-size="24">Snowflake governed evidence lake</text>
      <text x="34" y="75" class="cardText">Customer-owned database, roles, policies, and retention.</text>
      <g transform="translate(34 108)">
        <rect width="172" height="58" rx="12" class="snowBox"/>
        <text x="18" y="27" class="code">events_raw</text>
        <text x="18" y="43" class="tiny">hot row ingest</text>
      </g>
      <g transform="translate(236 108)">
        <rect width="172" height="58" rx="12" class="snowBox"/>
        <text x="18" y="27" class="code">findings_raw</text>
        <text x="18" y="43" class="tiny">scanner output</text>
      </g>
      <g transform="translate(34 188)">
        <rect width="172" height="58" rx="12" class="snowBox"/>
        <text x="18" y="27" class="code">evidence_bundle</text>
        <text x="18" y="43" class="tiny">audit packets</text>
      </g>
      <g transform="translate(236 188)">
        <rect width="172" height="58" rx="12" class="snowBox"/>
        <text x="18" y="27" class="code">audit_chain</text>
        <text x="18" y="43" class="tiny">legal hold</text>
      </g>
      <g transform="translate(34 270)">
        <rect width="374" height="56" rx="12" class="greenBox"/>
        <text x="187" y="25" text-anchor="middle" class="code">dynamic tables + streams/tasks</text>
        <text x="187" y="43" text-anchor="middle" class="tiny">fresh control rollups · SLA windows · owner metrics</text>
      </g>
      <text x="34" y="344" class="tiny">row access policies · masking policies · warehouse RBAC · query history</text>
    </g>

    <g transform="translate(1236 186)" filter="url(#shadow)">
      <rect width="198" height="300" rx="20" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.6"/>
      <text x="24" y="42" class="cardTitle">Open table path</text>
      <text x="24" y="66" class="cardText">Optional Iceberg variant.</text>
      <rect x="24" y="96" width="150" height="40" rx="10" class="purpleBox"/>
      <text x="99" y="121" text-anchor="middle" class="code">Iceberg tables</text>
      <rect x="24" y="150" width="150" height="40" rx="10" class="purpleBox"/>
      <text x="99" y="175" text-anchor="middle" class="code">Open Catalog</text>
      <rect x="24" y="204" width="150" height="40" rx="10" class="purpleBox"/>
      <text x="99" y="229" text-anchor="middle" class="code">Spark / Trino</text>
      <text x="24" y="270" class="tiny">same tables</text>
      <text x="24" y="286" class="tiny">REST catalog</text>
    </g>

    <line x1="368" y1="350" x2="414" y2="350" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <line x1="678" y1="350" x2="740" y2="350" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <line x1="1198" y1="350" x2="1222" y2="350" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 7"/>

    <g transform="translate(64 586)">
      <rect width="178" height="30" rx="15" fill="#3b0764" stroke="#a78bfa"/>
      <text x="89" y="20" text-anchor="middle" class="lanePurple">TRUSTOPS LOOP</text>
    </g>

    <g transform="translate(64 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Evaluate</text>
      <text x="26" y="64" class="cardText">controls-as-code over</text>
      <text x="26" y="86" class="cardText">fresh evidence slices</text>
      <text x="26" y="110" class="cardText">confidence from lineage</text>
    </g>

    <g transform="translate(408 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" fill="url(#purple)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Route work</text>
      <text x="26" y="64" class="cardText">DAG workflow canvas</text>
      <text x="26" y="86" class="cardText">owner, SLA, exception</text>
      <text x="26" y="110" class="cardText">webhook dry-run first</text>
    </g>

    <g transform="translate(752 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" class="goldBox"/>
      <text x="26" y="38" class="cardTitle">Prove posture</text>
      <text x="26" y="64" class="cardText">snapshot hash chain</text>
      <text x="26" y="86" class="cardText">trust share portal</text>
      <text x="26" y="110" class="cardText">agent-readable API</text>
    </g>

    <g transform="translate(1096 642)" filter="url(#shadow)">
      <rect width="338" height="132" rx="18" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Customer-owned boundary</text>
      <text x="26" y="64" class="cardText">storage, roles, keys, network,</text>
      <text x="26" y="86" class="cardText">retention, and query history</text>
      <text x="26" y="110" class="cardText">stay in the operator account.</text>
    </g>

    <line x1="330" y1="708" x2="394" y2="708" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <line x1="674" y1="708" x2="738" y2="708" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowGold)"/>
    <line x1="1018" y1="708" x2="1082" y2="708" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowGold)"/>
    <path d="M1226 642V526" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/>
    <path d="M884 642V526" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGold)"/>

    <g transform="translate(64 830)">
      <circle cx="0" cy="0" r="5" fill="#22d3ee"/><text x="16" y="4" class="tiny">stream/read</text>
      <circle cx="116" cy="0" r="5" fill="#34d399"/><text x="132" y="4" class="tiny">evaluate</text>
      <circle cx="220" cy="0" r="5" fill="#fbbf24"/><text x="236" y="4" class="tiny">snapshot/audit</text>
      <text x="390" y="4" class="tiny">TrustOps reads with least privilege, writes assessment state, and keeps remediation auditable.</text>
    </g>
  </g>
</svg>
