<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps control plane mosaic</title>
  <desc id="desc">A dense TrustOps product mosaic showing continuous posture, remediation workflow, graph mapping, evidence room, connectors, and trust center surfaces.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e7eef6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#10253d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#20c7d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { fill:#111827; font-size:21px; font-weight:950; }
      .sub { fill:#64748b; font-size:13px; font-weight:700; }
      .eyebrow { fill:#4f7cff; font-size:11px; font-weight:950; letter-spacing:2px; }
      .metric { fill:#111827; font-size:31px; font-weight:950; }
      .card { fill:#fff; stroke:#d9e3ef; stroke-width:1.2; }
      .chip { fill:#eff6ff; stroke:#dbeafe; stroke-width:1; }
      .tiny { fill:#64748b; font-size:10px; font-weight:750; }
      .darkText { fill:#f8fafc; font-size:14px; font-weight:900; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#page)"/>
  <g class="font" filter="url(#shadow)">
    <rect x="36" y="34" width="1212" height="654" rx="22" fill="#fff" stroke="#d9e3ef"/>
    <rect x="36" y="34" width="1212" height="68" rx="22" fill="#07111e"/>
    <rect x="36" y="80" width="1212" height="22" fill="#07111e"/>
    <circle cx="76" cy="68" r="18" fill="url(#accent)"/>
    <text x="71" y="74" fill="#fff" font-size="16" font-weight="950">T</text>
    <text x="104" y="74" fill="#fff" font-size="22" font-weight="950">TrustOps</text>
    <rect x="416" y="50" width="380" height="34" rx="10" fill="#0f1d31" stroke="#203550"/>
    <text x="438" y="72" fill="#94a3b8" font-size="13" font-weight="700">Search controls, evidence, owners, assets...</text>
    <rect x="986" y="50" width="94" height="34" rx="10" fill="#ecfdf5"/>
    <circle cx="1006" cy="67" r="5" fill="#10b981"/>
    <text x="1020" y="72" fill="#047857" font-size="13" font-weight="900">API live</text>
    <rect x="1092" y="50" width="94" height="34" rx="10" fill="#f8fafc"/>
    <text x="1116" y="72" fill="#111827" font-size="13" font-weight="900">Snapshot</text>
  </g>

  <g class="font">
    <g transform="translate(64 126)">
      <rect width="252" height="560" rx="16" fill="#08111e"/>
      <text x="24" y="42" fill="#64748b" font-size="11" font-weight="950" letter-spacing="3">WORKBENCH</text>
      <g transform="translate(22 78)">
        <rect width="208" height="38" rx="10" fill="#172a45"/>
        <text x="52" y="25" fill="#fff" font-size="14" font-weight="900">Command center</text>
      </g>
      <text x="74" y="158" fill="#cbd5e1" font-size="14" font-weight="850">Controls</text>
      <text x="74" y="208" fill="#cbd5e1" font-size="14" font-weight="850">Remediation</text>
      <text x="74" y="258" fill="#cbd5e1" font-size="14" font-weight="850">Evidence</text>
      <text x="74" y="308" fill="#cbd5e1" font-size="14" font-weight="850">Workflows</text>
      <text x="74" y="358" fill="#cbd5e1" font-size="14" font-weight="850">Graph</text>
      <text x="74" y="408" fill="#cbd5e1" font-size="14" font-weight="850">Connectors</text>
      <text x="74" y="458" fill="#cbd5e1" font-size="14" font-weight="850">Trust center</text>
    </g>

    <g transform="translate(348 130)">
      <text x="0" y="22" class="eyebrow">CURRENT POSTURE</text>
      <text x="0" y="58" fill="#111827" font-size="34" font-weight="950">Trust command center</text>
      <text x="0" y="84" class="sub">Posture, findings, evidence, owners, workflows, and audit actions.</text>

      <g transform="translate(0 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">POSTURE</text>
        <text x="20" y="68" class="metric">88%</text>
      </g>
      <g transform="translate(158 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">FAILING TESTS</text>
        <text x="20" y="68" class="metric" fill="#b91c1c">4</text>
      </g>
      <g transform="translate(316 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">EVIDENCE</text>
        <text x="20" y="68" class="metric">72</text>
      </g>
      <g transform="translate(474 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">SNAPSHOTS</text>
        <text x="20" y="68" class="metric">12</text>
      </g>

      <g transform="translate(0 250)">
        <rect width="392" height="210" rx="16" class="card"/>
        <text x="22" y="36" class="title">Fix next</text>
        <text x="22" y="58" class="sub">Owner-ready remediation queue.</text>
        <g transform="translate(22 84)">
          <rect width="348" height="36" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
          <text x="14" y="23" fill="#9a3412" font-size="13" font-weight="900">critical</text>
          <text x="92" y="23" fill="#111827" font-size="13" font-weight="900">Privileged access evidence</text>
        </g>
        <g transform="translate(22 130)">
          <rect width="348" height="36" rx="9" fill="#eff6ff" stroke="#dbeafe"/>
          <text x="14" y="23" fill="#1d4ed8" font-size="13" font-weight="900">request</text>
          <text x="92" y="23" fill="#111827" font-size="13" font-weight="900">Request missing owner evidence</text>
        </g>
      </g>

      <g transform="translate(420 250)">
        <rect width="392" height="210" rx="16" class="card"/>
        <text x="22" y="36" class="title">DAG workflow</text>
        <text x="22" y="58" class="sub">Trigger, route, act, and record.</text>
        <g transform="translate(36 96)">
          <rect width="92" height="38" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="46" y="24" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="950">evidence</text>
          <path d="M132 19h48" stroke="#94a3b8" stroke-width="3"/>
          <rect x="184" width="92" height="38" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
          <text x="230" y="24" text-anchor="middle" fill="#047857" font-size="12" font-weight="950">triage</text>
          <path d="M280 19h48" stroke="#94a3b8" stroke-width="3"/>
          <rect x="332" width="92" height="38" rx="12" fill="#fef3c7" stroke="#fde68a"/>
          <text x="378" y="24" text-anchor="middle" fill="#92400e" font-size="12" font-weight="950">ticket</text>
        </g>
      </g>
    </g>

    <g transform="translate(348 606)">
      <rect width="392" height="62" rx="16" fill="url(#dark)" stroke="#203550"/>
      <text x="22" y="28" class="darkText">Snowflake evidence lake</text>
      <text x="22" y="47" fill="#cbd5e1" font-size="12" font-weight="700">SELECT-only views feed posture and snapshots.</text>
    </g>
    <g transform="translate(768 606)">
      <rect width="392" height="62" rx="16" fill="url(#dark)" stroke="#203550"/>
      <text x="22" y="28" class="darkText">Graph + trust center</text>
      <text x="22" y="47" fill="#cbd5e1" font-size="12" font-weight="700">Framework, control, evidence, and asset paths.</text>
    </g>
  </g>
</svg>
