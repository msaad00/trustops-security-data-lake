<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps console product mosaic</title>
  <desc id="desc">TrustOps console mosaic showing Trust Home, audit room, evidence, connectors, frameworks, workflows, and headless API surfaces.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e7eef6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#10253d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#30c7d2"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#30c7d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { fill:#111827; font-size:21px; font-weight:950; }
      .sub { fill:#64748b; font-size:13px; font-weight:700; }
      .eyebrow { fill:#4f7cff; font-size:11px; font-weight:950; letter-spacing:2px; }
      .metric { fill:#111827; font-size:31px; font-weight:950; }
      .card { fill:#fff; stroke:#d9e3ef; stroke-width:1.2; }
      .tiny { fill:#64748b; font-size:10px; font-weight:750; }
      .darkText { fill:#f8fafc; font-size:14px; font-weight:900; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#page)"/>
  <g class="font" filter="url(#shadow)">
    <rect x="36" y="34" width="1212" height="654" rx="22" fill="#fff" stroke="#d9e3ef"/>
    <rect x="36" y="34" width="1212" height="68" rx="22" fill="#07111e"/>
    <rect x="36" y="80" width="1212" height="22" fill="#07111e"/>

    <!-- Brand lockup -->
    <g transform="translate(56,46)">
      <rect width="36" height="36" rx="9" fill="url(#mark)"/>
      <path d="M8 10h20v4.7h-7.4V32h-4.7V14.7H8z" fill="#fff"/>
      <circle cx="27" cy="27" r="7" fill="#fff"/>
      <path d="M23.5 27l2 2 4.5-4.5" stroke="#047857" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="26" fill="url(#accent)" font-size="20" font-weight="950">TrustOps</text>
    </g>

    <rect x="416" y="50" width="380" height="34" rx="10" fill="#0f1d31" stroke="#203550"/>
    <text x="438" y="72" fill="#94a3b8" font-size="13" font-weight="700">Search controls, evidence, tags, owners...</text>
    <rect x="930" y="50" width="108" height="34" rx="10" fill="#102a43" stroke="#38bdf8"/>
    <text x="946" y="72" fill="#7dd3fc" font-size="12" font-weight="900">SSE live</text>
    <rect x="1050" y="50" width="94" height="34" rx="10" fill="#ecfdf5"/>
    <circle cx="1070" cy="67" r="5" fill="#10b981"/>
    <text x="1084" y="72" fill="#047857" font-size="13" font-weight="900">API live</text>
    <rect x="1156" y="50" width="70" height="34" rx="10" fill="#f8fafc"/>
    <text x="1170" y="72" fill="#111827" font-size="12" font-weight="900">PDF</text>
  </g>

  <g class="font">
    <g transform="translate(64 126)">
      <rect width="252" height="560" rx="16" fill="#08111e"/>
      <text x="24" y="42" fill="#64748b" font-size="11" font-weight="950" letter-spacing="3">OPERATE</text>
      <g transform="translate(22 58)">
        <rect width="208" height="34" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
        <text x="52" y="22" fill="#7dd3fc" font-size="13" font-weight="900">Trust Home</text>
      </g>
      <g transform="translate(22 100)">
        <rect width="208" height="34" rx="10" fill="#172a45"/>
        <text x="52" y="22" fill="#fff" font-size="13" font-weight="900">Audit room</text>
      </g>
      <text x="74" y="162" fill="#cbd5e1" font-size="13" font-weight="850">Controls + tags</text>
      <text x="74" y="198" fill="#cbd5e1" font-size="13" font-weight="850">Evidence + views</text>
      <text x="74" y="234" fill="#cbd5e1" font-size="13" font-weight="850">Insights</text>
      <text x="74" y="270" fill="#cbd5e1" font-size="13" font-weight="850">Remediation</text>
      <text x="74" y="306" fill="#cbd5e1" font-size="13" font-weight="850">Graph + workflows</text>
      <text x="74" y="342" fill="#64748b" font-size="11" font-weight="950" letter-spacing="2">PROGRAMS</text>
      <text x="74" y="372" fill="#cbd5e1" font-size="13" font-weight="850">Policies</text>
      <text x="74" y="408" fill="#cbd5e1" font-size="13" font-weight="850">Vendor risk</text>
      <text x="74" y="444" fill="#64748b" font-size="11" font-weight="950" letter-spacing="2">CONFIGURE</text>
      <text x="74" y="474" fill="#cbd5e1" font-size="13" font-weight="850">Connectors</text>
      <text x="74" y="510" fill="#cbd5e1" font-size="13" font-weight="850">Trust center</text>
    </g>

    <g transform="translate(348 130)">
      <text x="0" y="22" class="eyebrow">TRUST HOME</text>
      <text x="0" y="58" fill="#111827" font-size="34" font-weight="950">Live posture command center</text>
      <text x="0" y="84" class="sub">Audit strip · insights · saved views · tags · framework drill-down · SSE.</text>

      <g transform="translate(0 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">POSTURE</text>
        <text x="20" y="68" class="metric">88%</text>
      </g>
      <g transform="translate(158 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">AUDIT SCORE</text>
        <text x="20" y="68" class="metric">82</text>
      </g>
      <g transform="translate(316 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">EVIDENCE</text>
        <text x="20" y="68" class="metric">72</text>
      </g>
      <g transform="translate(474 122)">
        <rect width="142" height="96" rx="14" class="card"/>
        <text x="20" y="32" class="tiny">FRAMEWORKS</text>
        <text x="20" y="68" class="metric">10</text>
      </g>

      <g transform="translate(0 250)">
        <rect width="392" height="210" rx="16" class="card"/>
        <text x="22" y="36" class="title">Insights strip</text>
        <text x="22" y="58" class="sub">MTTR · SLA breaches · posture trends.</text>
        <g transform="translate(22 84)">
          <rect width="348" height="36" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
          <text x="14" y="23" fill="#9a3412" font-size="13" font-weight="900">stale</text>
          <text x="72" y="23" fill="#111827" font-size="13" font-weight="900">3 controls past freshness SLA</text>
        </g>
        <g transform="translate(22 130)">
          <rect width="348" height="36" rx="9" fill="#eff6ff" stroke="#dbeafe"/>
          <text x="14" y="23" fill="#1d4ed8" font-size="13" font-weight="900">gap</text>
          <text x="72" y="23" fill="#111827" font-size="13" font-weight="900">Vendor diligence overdue</text>
        </g>
      </g>

      <g transform="translate(420 250)">
        <rect width="392" height="210" rx="16" class="card"/>
        <text x="22" y="36" class="title">Framework drill-down</text>
        <text x="22" y="58" class="sub">Control → rule → evidence → source.</text>
        <g transform="translate(24 96)">
          <rect width="74" height="38" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="37" y="24" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="950">control</text>
          <path d="M88 19h38" stroke="#94a3b8" stroke-width="3"/>
          <rect x="136" width="74" height="38" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
          <text x="173" y="24" text-anchor="middle" fill="#047857" font-size="10.5" font-weight="950">rule</text>
          <path d="M224 19h38" stroke="#94a3b8" stroke-width="3"/>
          <rect x="272" width="74" height="38" rx="12" fill="#fef3c7" stroke="#fde68a"/>
          <text x="309" y="24" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="950">evidence</text>
        </g>
      </g>
    </g>

    <g transform="translate(348 606)">
      <rect width="252" height="62" rx="16" fill="url(#dark)" stroke="#203550"/>
      <text x="22" y="28" class="darkText">Connectors</text>
      <text x="22" y="47" fill="#cbd5e1" font-size="12" font-weight="700">AWS · Azure · GCP · Snowflake · GitHub · GitLab</text>
    </g>
    <g transform="translate(618 606)">
      <rect width="252" height="62" rx="16" fill="url(#dark)" stroke="#203550"/>
      <text x="22" y="28" class="darkText">Repo graph</text>
      <text x="22" y="47" fill="#cbd5e1" font-size="12" font-weight="700">Topology + governance signals + control links.</text>
    </g>
    <g transform="translate(888 606)">
      <rect width="272" height="62" rx="16" fill="#102a43" stroke="#38bdf8"/>
      <text x="22" y="28" class="darkText">Headless surfaces</text>
      <text x="22" y="47" fill="#cbd5e1" font-size="12" font-weight="700">/api/v1 · MCP · agents · CI posture gate</text>
    </g>
  </g>
</svg>
