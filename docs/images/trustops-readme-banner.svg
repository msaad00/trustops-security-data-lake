<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps continuous trust control plane</title>
  <desc id="desc">A compact product hero showing TrustOps evidence ingestion, compliance assessment, workflow automation, graph mapping, and trust outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111c"/>
      <stop offset=".58" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#0b3d44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#29d3d3"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .eyebrow { fill: #7dd3fc; font-size: 17px; font-weight: 900; letter-spacing: 4px; }
      .headline { fill: #fff; font-size: 50px; font-weight: 950; letter-spacing: -1.4px; }
      .sub { fill: #cbd5e1; font-size: 19px; font-weight: 650; }
      .label { fill: #64748b; font-size: 12px; font-weight: 900; letter-spacing: 2px; }
      .title { fill: #f8fafc; font-size: 17px; font-weight: 900; }
      .body { fill: #cbd5e1; font-size: 13px; font-weight: 650; }
      .tiny { fill: #94a3b8; font-size: 11px; font-weight: 750; }
      .dark { fill: #0f172a; stroke: #2d4058; stroke-width: 1.4; }
      .panel { fill: #101b2b; stroke: #2d4058; stroke-width: 1.3; }
      .light { fill: #f8fafc; stroke: #dbeafe; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1086" cy="118" r="190" fill="none" stroke="#315dff" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="1030" cy="402" r="135" fill="none" stroke="#30c7d2" stroke-opacity=".2" stroke-width="2"/>

  <g class="font">
    <text x="52" y="72" class="eyebrow">CONTINUOUS TRUST OPERATIONS</text>
    <text x="52" y="132" class="headline">TrustOps control plane</text>
    <text x="52" y="171" class="sub">Live compliance posture from evidence lakes, controls-as-code,</text>
    <text x="52" y="198" class="sub">audit room, freshness SLA, snapshots, and agent APIs.</text>

    <g filter="url(#shadow)">
      <rect x="52" y="244" width="256" height="128" rx="18" class="panel"/>
      <text x="76" y="284" class="title">Evidence intake</text>
      <text x="76" y="313" class="body">cloud - identity - repos</text>
      <text x="76" y="339" class="body">tickets - Snowflake - lake</text>
      <rect x="76" y="354" width="168" height="10" rx="5" fill="#1e293b"/>
      <rect x="76" y="354" width="132" height="10" rx="5" fill="url(#accent)"/>

      <rect x="342" y="244" width="256" height="128" rx="18" class="panel"/>
      <text x="366" y="284" class="title">Assessment engine</text>
      <text x="366" y="313" class="body">rules, freshness SLA, owners,</text>
      <text x="366" y="339" class="body">violations, confidence</text>
      <g transform="translate(366 354)">
        <rect width="48" height="16" rx="8" fill="#dcfce7"/>
        <text x="24" y="12" text-anchor="middle" fill="#047857" font-size="10" font-weight="900">PASS</text>
        <rect x="58" width="48" height="16" rx="8" fill="#fee2e2"/>
        <text x="82" y="12" text-anchor="middle" fill="#b91c1c" font-size="10" font-weight="900">FAIL</text>
      </g>

      <rect x="632" y="244" width="256" height="128" rx="18" fill="url(#purple)" stroke="#a78bfa" stroke-width="1.3"/>
      <text x="656" y="284" class="title">Workflow automation</text>
      <text x="656" y="313" class="body">assign owners, request evidence,</text>
      <text x="656" y="339" class="body">run guarded ticket/webhook actions</text>

      <rect x="922" y="244" width="256" height="128" rx="18" class="light"/>
      <text x="946" y="284" fill="#111827" font-size="17" font-weight="950">Trust outputs</text>
      <text x="946" y="313" fill="#475569" font-size="13" font-weight="750">console - audit room - shares</text>
      <text x="946" y="339" fill="#475569" font-size="13" font-weight="750">OpenAPI - MCP - SDKs</text>
    </g>

    <path d="M318 308h26" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M608 308h26" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M898 308h26" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(52 414)" filter="url(#shadow)">
      <rect width="262" height="62" rx="16" fill="#082f49" stroke="#38bdf8"/>
      <text x="22" y="27" class="label">GOVERNED LAKE</text>
      <text x="22" y="47" class="tiny">Snowflake + ClickHouse paths</text>
    </g>
    <g transform="translate(342 414)" filter="url(#shadow)">
      <rect width="262" height="62" rx="16" fill="url(#green)" stroke="#34d399"/>
      <text x="22" y="27" class="label" fill="#a7f3d0">CURRENT POSTURE</text>
      <text x="22" y="47" class="tiny">confidence-scored checks</text>
    </g>
    <g transform="translate(632 414)" filter="url(#shadow)">
      <rect width="262" height="62" rx="16" fill="#451a03" stroke="#f59e0b"/>
      <text x="22" y="27" class="label" fill="#fed7aa">AUDIT READINESS</text>
      <text x="22" y="47" class="tiny">score, gaps, freshness SLA</text>
    </g>
    <g transform="translate(922 414)" filter="url(#shadow)">
      <rect width="256" height="62" rx="16" class="panel"/>
      <text x="22" y="27" class="label">HEADLESS AGENTS</text>
      <text x="22" y="47" class="tiny">same facts via API and MCP</text>
    </g>
  </g>
</svg>
