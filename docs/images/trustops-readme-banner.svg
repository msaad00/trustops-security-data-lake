<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">The TrustOps operating loop</title>
  <desc id="desc">Four stages turn customer-owned evidence into deterministic controls and audit-ready proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#092b34"/>
    </linearGradient>
    <linearGradient id="line" x1="70" y1="0" x2="1210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6687ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .step { font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #7dd3fc; }
      .name { font-size: 25px; font-weight: 850; fill: #f8fafc; }
      .body { font-size: 14px; font-weight: 600; fill: #a8b5c7; }
    </style>
  </defs>
  <rect width="1280" height="330" rx="26" fill="url(#bg)"/>
  <path d="M0 254C232 182 382 326 626 250s403-21 654-109v189H0Z" fill="#0da6a6" opacity="0.08"/>
  <g class="font">
    <text x="64" y="55" font-size="14" font-weight="800" letter-spacing="2.4" fill="#7c93b4">ONE OPERATING LOOP</text>
    <text x="64" y="91" font-size="25" font-weight="800" fill="#eef5ff">From source evidence to verifiable posture</text>
    <path d="M76 145H1204" stroke="url(#line)" stroke-width="3" opacity="0.55"/>
    <g transform="translate(64 124)">
      <circle cx="18" cy="21" r="18" fill="#6687ff"/>
      <text x="18" y="26" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">1</text>
      <text x="0" y="72" class="step">COLLECT</text>
      <text x="0" y="105" class="name">Evidence lake</text>
      <text x="0" y="132" class="body">Read-only · customer-owned</text>
      <text x="0" y="153" class="body">Bronze → silver → gold</text>
    </g>
    <g transform="translate(360 124)">
      <circle cx="18" cy="21" r="18" fill="#5c83fa"/>
      <text x="18" y="26" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">2</text>
      <text x="0" y="72" class="step">EVALUATE</text>
      <text x="0" y="105" class="name">Control tests</text>
      <text x="0" y="132" class="body">Deterministic verdicts</text>
      <text x="0" y="153" class="body">Freshness · provenance</text>
    </g>
    <g transform="translate(656 124)">
      <circle cx="18" cy="21" r="18" fill="#40a8dc"/>
      <text x="18" y="26" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">3</text>
      <text x="0" y="72" class="step">OPERATE</text>
      <text x="0" y="105" class="name">Findings</text>
      <text x="0" y="132" class="body">Owners · remediation</text>
      <text x="0" y="153" class="body">Approvals · audit trail</text>
    </g>
    <g transform="translate(952 124)">
      <circle cx="18" cy="21" r="18" fill="#2dd4bf"/>
      <text x="18" y="26" text-anchor="middle" font-size="14" font-weight="900" fill="#06201e">4</text>
      <text x="0" y="72" class="step">PROVE</text>
      <text x="0" y="105" class="name">Audit-ready proof</text>
      <text x="0" y="132" class="body">Immutable snapshots</text>
      <text x="0" y="153" class="body">Console · API · CLI · MCP</text>
    </g>
  </g>
</svg>
