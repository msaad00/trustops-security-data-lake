<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps continuous compliance platform</title>
  <desc id="desc">Simplified hero: connectors feed the evidence lake, deterministic control tests, and audit-ready workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d18"/>
      <stop offset=".5" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#0a3038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#30c7d2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121f33"/>
      <stop offset="1" stop-color="#0c1626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #7dd3fc; font-size: 12px; font-weight: 900; letter-spacing: 2.4px; }
      .headline { fill: #fff; font-size: 38px; font-weight: 950; letter-spacing: -1px; }
      .sub { fill: #cbd5e1; font-size: 16px; font-weight: 650; }
      .chip { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .chipText { fill: #e2e8f0; font-size: 11px; font-weight: 850; }
      .label { fill: #64748b; font-size: 10px; font-weight: 900; letter-spacing: 1.6px; }
      .title { fill: #f8fafc; font-size: 17px; font-weight: 900; }
      .body { fill: #94a3b8; font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1180" cy="70" r="140" fill="none" stroke="#315dff" stroke-opacity=".14" stroke-width="2"/>

  <g class="font">
    <text x="48" y="58" class="eyebrow">CONTINUOUS COMPLIANCE IN YOUR VPC</text>

    <g transform="translate(900,36)">
      <rect width="108" height="32" rx="10" class="chip"/>
      <text x="16" y="21" class="chipText">635 controls</text>
      <rect x="118" width="132" height="32" rx="10" fill="#102a43" stroke="#38bdf8" stroke-width="1"/>
      <text x="134" y="21" fill="#7dd3fc" font-size="11" font-weight="900">/api/v1 · MCP · CI</text>
    </g>

    <text x="48" y="118" class="headline">Connect sources. Prove controls. Ship audit-ready.</text>
    <text x="48" y="152" class="sub">Read-only connectors → evidence lake → deterministic tests → audit room</text>

    <g transform="translate(48,188)">
      <rect width="1184" height="44" rx="12" fill="#0a1320" stroke="#243044"/>
      <text x="16" y="18" class="label">CONNECTORS</text>
      <g transform="translate(16,24)">
        <rect width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="32" y="12" text-anchor="middle" fill="#FF9900" font-size="9" font-weight="900">AWS</text>
        <rect x="72" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="104" y="12" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="900">Azure</text>
        <rect x="144" width="56" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="172" y="12" text-anchor="middle" fill="#4285F4" font-size="9" font-weight="900">GCP</text>
        <rect x="208" width="72" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="244" y="12" text-anchor="middle" fill="#29B5E8" font-size="9" font-weight="900">Snowflake</text>
        <rect x="288" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="320" y="12" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="900">GitHub</text>
        <rect x="360" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="392" y="12" text-anchor="middle" fill="#FC6D26" font-size="9" font-weight="900">GitLab</text>
        <rect x="432" width="52" height="16" rx="8" fill="#111827" stroke="#334155"/>
        <text x="458" y="12" text-anchor="middle" fill="#007DC1" font-size="9" font-weight="900">Okta</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(48,256)">
        <rect width="288" height="128" rx="16" fill="url(#panel)" stroke="#334155"/>
        <text x="22" y="34" class="label">01 · INGEST</text>
        <text x="22" y="62" class="title">Evidence lake</text>
        <text x="22" y="88" class="body">Bronze / silver / gold in your VPC</text>
      </g>
      <g transform="translate(352,256)">
        <rect width="288" height="128" rx="16" fill="url(#panel)" stroke="#334155"/>
        <text x="22" y="34" class="label">02 · EVALUATE</text>
        <text x="22" y="62" class="title">Control tests</text>
        <text x="22" y="88" class="body">Deterministic pass / fail · freshness SLA</text>
      </g>
      <g transform="translate(656,256)">
        <rect width="288" height="128" rx="16" fill="#1e1b4b" stroke="#6366f1"/>
        <text x="22" y="34" class="label" fill="#c4b5fd">03 · OPERATE</text>
        <text x="22" y="62" class="title">Audit room</text>
        <text x="22" y="88" class="body">Snapshots · remediation · vendor / policy</text>
      </g>
      <g transform="translate(960,256)">
        <rect width="272" height="128" rx="16" fill="#f8fafc" stroke="#dbeafe"/>
        <text x="22" y="34" fill="#64748b" font-size="10" font-weight="900" letter-spacing="1.6">04 · PROVE</text>
        <text x="22" y="62" fill="#0f172a" font-size="17" font-weight="950">Console · API · MCP</text>
        <text x="22" y="88" fill="#475569" font-size="13" font-weight="750">Same JSON for humans, agents, and auditors</text>
      </g>
    </g>

    <path d="M344 320h12" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M648 320h12" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M944 320h12" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
