<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TrustOps open-source trust operations</title>
  <desc id="desc">TrustOps social share card with brand lockup, connector ecosystem, and headless compliance surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="55%" stop-color="#0b1526"/>
      <stop offset="100%" stop-color="#0a3038"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#30c7d2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#30c7d2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="180" fill="none" stroke="#315dff" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="140" cy="520" r="120" fill="none" stroke="#30c7d2" stroke-opacity=".16" stroke-width="2"/>

  <!-- Lockup -->
  <g transform="translate(72,88)">
    <rect width="72" height="72" rx="18" fill="url(#mark)"/>
    <path d="M18 18h36v9.5h-13.2V54h-9.5V27.5H18z" fill="#fff"/>
    <circle cx="54" cy="54" r="14" fill="#fff"/>
    <path d="M47 54l5 5 11-11" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="44" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="950" fill="url(#accent)">TrustOps</text>
    <text x="93" y="68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" fill="#64748b" letter-spacing="2">YOUR LAKE · DETERMINISTIC CONTROLS · PROOF</text>
  </g>

  <!-- Metric chips -->
  <g transform="translate(72,188)">
    <rect width="110" height="32" rx="10" fill="#111827" stroke="#334155"/>
    <text x="18" y="21" fill="#e2e8f0" font-size="12" font-weight="850">741 controls</text>
    <rect x="122" width="110" height="32" rx="10" fill="#111827" stroke="#334155"/>
    <text x="140" y="21" fill="#e2e8f0" font-size="12" font-weight="850">28 routes</text>
    <rect x="244" width="150" height="32" rx="10" fill="#102a43" stroke="#38bdf8"/>
    <text x="260" y="21" fill="#7dd3fc" font-size="12" font-weight="900">/api/v1 · MCP · CI</text>
  </g>

  <text x="72" y="270" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="650" fill="#e2e8f0">Continuous compliance in your VPC.</text>
  <text x="72" y="316" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="650" fill="#e2e8f0">Deterministic controls. Audit-ready proof.</text>

  <!-- Connector strip -->
  <g transform="translate(72,360)">
    <rect width="1056" height="48" rx="12" fill="#0a1320" stroke="#243044"/>
    <text x="18" y="20" fill="#64748b" font-size="10" font-weight="900" letter-spacing="1.6">LIVE CONNECTORS</text>
    <g transform="translate(18,26)">
      <rect width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="32" y="12" text-anchor="middle" fill="#FF9900" font-size="9" font-weight="900">AWS</text>
      <rect x="72" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="104" y="12" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="900">Azure</text>
      <rect x="144" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="176" y="12" text-anchor="middle" fill="#4285F4" font-size="9" font-weight="900">GCP</text>
      <rect x="216" width="78" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="255" y="12" text-anchor="middle" fill="#29B5E8" font-size="9" font-weight="900">Snowflake</text>
      <rect x="302" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="334" y="12" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="900">GitHub</text>
      <rect x="374" width="64" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="406" y="12" text-anchor="middle" fill="#FC6D26" font-size="9" font-weight="900">GitLab</text>
      <rect x="446" width="56" height="16" rx="8" fill="#111827" stroke="#334155"/>
      <text x="474" y="12" text-anchor="middle" fill="#007DC1" font-size="9" font-weight="900">Okta</text>
    </g>
  </g>

  <text x="72" y="460" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" letter-spacing="2.2">API · CLI · MCP · CI · CONSOLE</text>
  <text x="72" y="510" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" fill="#64748b">Models summarize — deterministic tests own the verdict.</text>
</svg>
